services:
  - type: web
    name: voice-agent-gateway
    env: node
    plan: free
    region: oregon
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: HOST
        value: 0.0.0.0
      - key: MONGODB_URI
        sync: false
      - key: VOICE_WEBHOOK_SECRET
        sync: false
      - key: ENABLE_WEBHOOK_AUTH
        value: "true"
      - key: ALLOWED_ORIGINS
        value: "*"
      - key: MAX_REQUEST_SIZE
        value: "1mb"
      - key: LOG_LEVEL
        value: info
